<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShelfOps — Система управления магазином</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- ═══════════ CUSTOM TITLE BAR ═══════════ -->
  <div class="titlebar">
    <div class="tb-brand">
      <svg class="tb-logo" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#F5A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
        <line x1="12" y1="22.08" x2="12" y2="12"/>
      </svg>
      <span class="tb-wordmark">ShelfOps</span>
    </div>
    <div class="tb-controls">
      <button class="tb-btn" id="tb-minimize" title="Свернуть">
        <svg viewBox="0 0 24 24" width="14" height="14"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="tb-btn" id="tb-maximize" title="Развернуть">
        <svg viewBox="0 0 24 24" width="12" height="12"><rect x="5" y="5" width="14" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="tb-btn tb-close" id="tb-close" title="Закрыть">
        <svg viewBox="0 0 24 24" width="14" height="14"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="1.6"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
    </div>
  </div>

  <!-- ═══════════ LOGIN SCREEN ═══════════ -->
  <section id="screen-login" class="screen visible">
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo-ring">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#F5A623" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <h1 class="login-title">ShelfOps</h1>
        <p class="login-subtitle">Система управления магазином</p>

        <div class="field">
          <label for="login-username">Имя пользователя</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="login-username" type="text" placeholder="Имя пользователя" autofocus>
          </div>
        </div>

        <div class="field">
          <label for="login-password">Пароль</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input id="login-password" type="password" placeholder="Пароль">
          </div>
        </div>

        <div id="login-error" class="error-banner hidden"></div>

        <button id="login-submit" class="btn btn-primary btn-block">Войти в систему</button>
        <div id="login-loading" class="spinner-bar hidden"></div>

        <p class="login-version">v1.0.0</p>
      </div>
    </div>
  </section>

  <!-- ═══════════ SHELL (sidebar + main) ═══════════ -->
  <div id="shell" class="shell hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sb-user" id="sb-user">
        <div class="sb-avatar">&#128100;</div>
        <div class="sb-user-text">
          <div class="sb-user-name" id="sb-user-name"></div>
          <div class="sb-user-role" id="sb-user-role"></div>
        </div>
      </div>

      <nav class="sb-nav" id="sb-nav"></nav>

      <div class="sb-footer">
        <button id="sb-collapse" class="nav-btn" title="Свернуть / Развернуть панель">
          <span class="nav-icon" id="collapse-icon"></span>
          <span class="nav-label">Свернуть</span>
        </button>
        <button id="sb-logout" class="nav-btn nav-btn-danger" title="Выйти">
          <span class="nav-icon"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></span>
          <span class="nav-label">Выйти</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h2 class="topbar-title" id="topbar-title"></h2>
        <div class="topbar-user">
          <span class="topbar-user-name" id="topbar-user-name"></span>
        </div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>

  <!-- overlays -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>
